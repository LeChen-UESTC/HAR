base_config: /data/chenle/GIRCSE/HAR/configs/ntu60_zsl_48_12.yaml

experiment:
  tags: ["ntu60", "48-12", "warmup", "classwise-infonce"]

train:
  stage: prealign
  epochs: 10
  batch_size: 64
  lr_projector: 0.0001
  lr_shift_gcn: 0.00001
  freeze_shift_gcn: true
  eval_during_train: false

model:
  projector:
    type: part_aware_qformer
    in_dim: 256
    llm_dim: 3584
    target_temporal_bins: 4
    num_query_tokens: 7
    query_roles:
      - head
      - left_arm
      - right_arm
      - torso
      - left_leg
      - right_leg
      - global
    qformer_hidden_dim: 768
    qformer_num_layers: 6
    qformer_num_heads: 12
    qformer_intermediate_dim: 3072
    cross_attention_freq: 2
    hidden_dropout_prob: 0.1
    attention_probs_dropout_prob: 0.1
    initializer_range: 0.02
    init_from_pretrained: false
    pretrained_name_or_path: bert-base-uncased
    use_part_token_embeddings: true
    joint_part_roles:
      - torso
      - torso
      - head
      - head
      - left_arm
      - left_arm
      - left_arm
      - left_arm
      - right_arm
      - right_arm
      - right_arm
      - right_arm
      - left_leg
      - left_leg
      - left_leg
      - left_leg
      - right_leg
      - right_leg
      - right_leg
      - right_leg
      - torso
      - left_arm
      - left_arm
      - right_arm
      - right_arm

loss:
  type: classwise_infonce
  temperature: 0.05
