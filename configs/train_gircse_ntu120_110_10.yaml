base_config: /data/chenle/GIRCSE/HAR/configs/ntu120_zsl_110_10.yaml

runtime:
  device_map_train: auto

experiment:
  name_style: compact
  tags: ["ntu120", "110-10", "generative", "stepwise", "irr"]

train:
  stage: skeleton_gircse
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  lr_projector: 0.0001
  lr_shift_gcn: 0.00001
  freeze_shift_gcn: true
  freeze_llm: true
  freeze_lm_head: true
  eval_during_train: false
  eval_freq: 1
  save_freq: 1

model:
  soft_tokens:
    k_train: 5

loss:
  type: stepwise_infonce_irr
  temperature: 0.05
  lambda_irr: 1.0
