base_config: /data/chenle/GIRCSE/HAR/configs/ntu60_zsl_48_12.yaml

runtime:
  device_map_train: auto

experiment:
  name_style: compact
  tags: ["ntu60", "48-12", "generative", "stepwise", "irr"]

train:
  stage: skeleton_gircse
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  lr_projector: 0.0001
  lr_shift_gcn: 0.00001
  freeze_shift_gcn: true
  freeze_llm: true
  freeze_lm_head: true
  eval_during_train: false
  eval_freq: 1
  save_freq: 1

model:
  projector:
    type: part_aware_qformer
    in_dim: 256
    llm_dim: 3584
    target_temporal_bins: 4
    num_query_tokens: 7
    query_roles:
      - head
      - left_arm
      - right_arm
      - torso
      - left_leg
      - right_leg
      - global
    qformer_hidden_dim: 768
    qformer_num_layers: 6
    qformer_num_heads: 12
    qformer_intermediate_dim: 3072
    cross_attention_freq: 2
    hidden_dropout_prob: 0.1
    attention_probs_dropout_prob: 0.1
    initializer_range: 0.02
    init_from_pretrained: false
    pretrained_name_or_path: bert-base-uncased
    use_part_token_embeddings: true
    joint_part_roles:
      - torso
      - torso
      - head
      - head
      - left_arm
      - left_arm
      - left_arm
      - left_arm
      - right_arm
      - right_arm
      - right_arm
      - right_arm
      - left_leg
      - left_leg
      - left_leg
      - left_leg
      - right_leg
      - right_leg
      - right_leg
      - right_leg
      - torso
      - left_arm
      - left_arm
      - right_arm
      - right_arm
  soft_tokens:
    k_train: 5

loss:
  type: stepwise_infonce_irr
  temperature: 0.05
  lambda_irr: 1.0
