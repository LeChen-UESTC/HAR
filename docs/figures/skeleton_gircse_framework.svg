<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Skeleton-GIRCSE framework</title>
  <desc id="desc">A white-background CVPR-style framework diagram for text bank construction, skeleton-conditioned GIRCSE training, part-aware Q-Former projection, and step-wise InfoNCE loss.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #222222; stroke-width: 2.2; rx: 12; }
      .subpanel { fill: #f8fafc; stroke: #475569; stroke-width: 1.6; rx: 10; }
      .text-panel { fill: #eef6ff; stroke: #2f6f9f; stroke-width: 1.8; rx: 10; }
      .skel-panel { fill: #fff7ed; stroke: #b45309; stroke-width: 1.8; rx: 10; }
      .model-panel { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 1.8; rx: 10; }
      .loss-panel { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; rx: 10; }
      .thin { stroke: #334155; stroke-width: 1.8; fill: none; }
      .arrow { stroke: #111827; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash-arrow { stroke: #64748b; stroke-width: 2.0; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowGray); }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 31px; font-weight: 700; fill: #0f172a; }
      .section { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #1f2937; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #334155; }
      .math { font-family: "Times New Roman", Times, serif; font-size: 20px; font-style: italic; fill: #111827; }
      .badge { fill: #111827; rx: 11; }
      .badge-text { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text x="800" y="58" text-anchor="middle" class="title">Skeleton-GIRCSE for Zero-Shot Skeleton Action Recognition</text>

  <!-- Main panels -->
  <rect x="55" y="100" width="1490" height="280" class="panel"/>
  <rect x="55" y="430" width="1490" height="360" class="panel"/>
  <text x="85" y="138" class="section">Text branch: class semantic bank</text>
  <text x="85" y="468" class="section">Skeleton branch: action-to-text embedding alignment</text>

  <!-- Text branch -->
  <rect x="95" y="178" width="210" height="120" class="text-panel"/>
  <text x="200" y="216" text-anchor="middle" class="label">Action classes</text>
  <text x="200" y="250" text-anchor="middle" class="small">structured</text>
  <text x="200" y="274" text-anchor="middle" class="small">descriptions</text>

  <rect x="360" y="178" width="265" height="120" class="text-panel"/>
  <text x="492" y="214" text-anchor="middle" class="label">Text prompt</text>
  <text x="492" y="248" text-anchor="middle" class="small">instruction + text</text>
  <text x="492" y="272" text-anchor="middle" class="tiny">label / motion / phase views</text>

  <rect x="680" y="178" width="285" height="120" class="model-panel"/>
  <text x="822" y="214" text-anchor="middle" class="label">GIRCSE text encoder</text>
  <text x="822" y="248" text-anchor="middle" class="small">generate 20 language</text>
  <text x="822" y="272" text-anchor="middle" class="small">soft tokens</text>

  <rect x="1020" y="178" width="245" height="120" class="text-panel"/>
  <text x="1142" y="214" text-anchor="middle" class="label">Mean pooling</text>
  <text x="1142" y="248" text-anchor="middle" class="small">last-layer hidden states</text>
  <text x="1142" y="272" text-anchor="middle" class="math">z<tspan baseline-shift="sub" font-size="14">text</tspan></text>

  <rect x="1320" y="178" width="175" height="120" class="text-panel"/>
  <text x="1408" y="214" text-anchor="middle" class="label">Text bank</text>
  <text x="1408" y="248" text-anchor="middle" class="small">Zmain / Zlabel</text>
  <text x="1408" y="272" text-anchor="middle" class="small">Zmotion / Zphase</text>

  <path d="M305 238 L360 238" class="arrow"/>
  <path d="M625 238 L680 238" class="arrow"/>
  <path d="M965 238 L1020 238" class="arrow"/>
  <path d="M1265 238 L1320 238" class="arrow"/>

  <!-- Skeleton branch -->
  <rect x="95" y="525" width="210" height="125" class="skel-panel"/>
  <text x="200" y="563" text-anchor="middle" class="label">Skeleton sequence</text>
  <text x="200" y="599" text-anchor="middle" class="small">3D joints over time</text>
  <text x="200" y="624" text-anchor="middle" class="tiny">NTU60 / NTU120</text>

  <rect x="360" y="525" width="225" height="125" class="skel-panel"/>
  <text x="472" y="563" text-anchor="middle" class="label">Shift-GCN</text>
  <text x="472" y="599" text-anchor="middle" class="small">spatio-temporal</text>
  <text x="472" y="624" text-anchor="middle" class="small">skeleton features</text>

  <rect x="640" y="500" width="305" height="175" class="model-panel"/>
  <text x="792" y="538" text-anchor="middle" class="label">Part-aware Q-Former</text>
  <text x="792" y="573" text-anchor="middle" class="small">joint-role embedding</text>
  <text x="792" y="598" text-anchor="middle" class="tiny">6 part + 3 phase + global + free</text>
  <line x1="682" y1="620" x2="902" y2="620" class="thin"/>
  <text x="792" y="649" text-anchor="middle" class="small">16 query tokens to LLM dim</text>

  <rect x="1000" y="525" width="245" height="125" class="model-panel"/>
  <text x="1122" y="563" text-anchor="middle" class="label">GIRCSE generator</text>
  <text x="1122" y="599" text-anchor="middle" class="small">input order</text>
  <text x="1122" y="624" text-anchor="middle" class="small">Tskel + prompt</text>

  <rect x="1300" y="500" width="195" height="175" class="model-panel"/>
  <text x="1398" y="538" text-anchor="middle" class="label">K soft tokens</text>
  <text x="1398" y="573" text-anchor="middle" class="small">hidden states</text>
  <text x="1398" y="599" text-anchor="middle" class="math">h<tspan baseline-shift="super" font-size="14">1</tspan>, ..., h<tspan baseline-shift="super" font-size="14">K</tspan></text>
  <line x1="1330" y1="620" x2="1465" y2="620" class="thin"/>
  <text x="1398" y="649" text-anchor="middle" class="small">cumulative mean</text>

  <rect x="680" y="710" width="320" height="58" class="subpanel"/>
  <text x="840" y="747" text-anchor="middle" class="small">Projector alternatives: linear / general Q-Former / part-aware Q-Former</text>

  <path d="M305 588 L360 588" class="arrow"/>
  <path d="M585 588 L640 588" class="arrow"/>
  <path d="M945 588 L1000 588" class="arrow"/>
  <path d="M1245 588 L1300 588" class="arrow"/>

  <!-- Loss block -->
  <rect x="1110" y="700" width="385" height="70" class="loss-panel"/>
  <text x="1302" y="729" text-anchor="middle" class="label">Step-wise class-wise InfoNCE</text>
  <text x="1302" y="756" text-anchor="middle" class="small">mean over K steps + IRR regularizer</text>

  <path d="M1408 298 L1408 395 L1525 395 L1525 735 L1495 735" class="dash-arrow"/>
  <path d="M1398 675 L1398 700" class="arrow"/>

  <!-- Formula strip -->
  <rect x="95" y="812" width="1400" height="54" class="subpanel"/>
  <text x="795" y="846" text-anchor="middle" class="small">
    z_text = MeanPool(H_text^1 ... H_text^20),  z_skel^k = MeanPool(H_skel^1 ... H_skel^k),  L = mean_k CE( z_skel^k * Z_text / tau ) + lambda_irr L_IRR
  </text>

  <!-- Badges -->
  <rect x="130" y="332" width="160" height="30" class="badge"/>
  <text x="210" y="353" text-anchor="middle" class="badge-text">offline cache</text>
  <rect x="1270" y="332" width="185" height="30" class="badge"/>
  <text x="1362" y="353" text-anchor="middle" class="badge-text">fixed text targets</text>
  <rect x="1170" y="462" width="172" height="30" class="badge"/>
  <text x="1256" y="483" text-anchor="middle" class="badge-text">trainable projector</text>
  <rect x="1360" y="462" width="92" height="30" class="badge"/>
  <text x="1406" y="483" text-anchor="middle" class="badge-text">frozen LLM</text>
</svg>
